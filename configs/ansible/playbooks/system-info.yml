--- 
- name: Display system information 
  hosts: all

  tasks: 
    - name: Display system information as table 
      debug:
        msg: | 
          | Host | Käyttöjärjestelmä | IP-osoite | Prosessorit | Muisti |
          |---|---|---|---:|---:|
          {% for host in ansible_play_hosts %}
          | {{ host }} | {{ hostvars[host].ansible_distribution }} {{ hostvars[host].ansible_distribution_version }} | {{ hostvars[host].ansible_default_ipv4.address }} | {{ hostvars[host].ansible_processor_vcpus }} | {{ hostvars[host].ansible_memtotal_mb }} MB |
          {% endfor %}
      run_once: true